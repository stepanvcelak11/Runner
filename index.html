<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CHRONO-SPIRE</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d10;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#f4f6f8;touch-action:none}
button{font-family:inherit}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#c.glitch{animation:glitch .5s steps(2,end)}
@keyframes glitch{0%{transform:translate(0,0)}20%{transform:translate(-8px,0) skewX(4deg)}40%{transform:translate(9px,1px) skewX(-3deg)}60%{transform:translate(-4px,-1px)}100%{transform:none}}
#flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0}
#flash.on{animation:fl .5s ease-out}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
#hud,#bInv,#bPause,#chip,#hint,#toast{display:none}
body.ingame #hud,body.ingame #bInv,body.ingame #bPause{display:flex}
body.ingame #chip.show{display:block}
body.ingame #hint,body.ingame #toast{display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));flex-direction:column}
#top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;width:100%}
.num{font-size:clamp(24px,7vw,36px);font-weight:700;letter-spacing:.5px;text-shadow:0 2px 8px #0008;font-variant-numeric:tabular-nums}
.sm{font-size:11px;opacity:.85;letter-spacing:1.2px;white-space:nowrap;text-shadow:0 1px 4px #0009;text-transform:uppercase}
#zone{text-align:center;font-size:10px;letter-spacing:2px;opacity:.9;text-transform:uppercase;text-shadow:0 1px 4px #0009}
#ebar{margin:6px auto 0;width:min(100%,360px);height:6px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.22)}
#efill{height:100%;width:100%;background:#fff;transition:background .4s;border-radius:4px}
body.inv #efill{background:#ffc47a}
#elabel{text-align:center;font-size:10px;letter-spacing:2px;margin-top:4px;opacity:.85;text-transform:uppercase;text-shadow:0 1px 4px #0009}
#lives{font-size:17px;letter-spacing:1px;text-align:right;white-space:nowrap;text-shadow:0 1px 6px #0009}
#bPause{position:fixed;top:max(64px,calc(env(safe-area-inset-top) + 54px));right:max(14px,env(safe-area-inset-right));width:36px;height:36px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(15,20,26,.4);color:#fff;font-size:14px;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
#chip{position:fixed;top:92px;left:50%;transform:translateX(-50%);width:max-content;max-width:92%;padding:6px 12px;border-radius:20px;background:rgba(15,18,22,.55);backdrop-filter:blur(8px);font-size:12px;letter-spacing:.6px;white-space:nowrap}
#hint{position:fixed;top:23%;left:0;right:0;text-align:center;font-size:clamp(16px,4.6vw,26px);font-weight:700;letter-spacing:.5px;text-shadow:0 2px 12px #000b;opacity:0;transition:opacity .2s;padding:0 18px}
#toast{position:fixed;top:34%;left:0;right:0;text-align:center;font-size:clamp(20px,5.4vw,32px);font-weight:800;opacity:0;pointer-events:none;text-shadow:0 2px 14px #000b}
#toast.on{animation:toast 1.2s ease-out}
@keyframes toast{0%{opacity:0;transform:scale(.8)}15%{opacity:1;transform:scale(1.05)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.btn{position:fixed;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;letter-spacing:1.5px;pointer-events:auto;border:1.5px solid rgba(255,255,255,.6);background:rgba(18,24,32,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;box-shadow:0 6px 28px #0006;touch-action:none;font-size:11px;gap:6px;text-transform:uppercase}
.btn:active,.btn.down{transform:scale(.94);background:rgba(255,255,255,.25)}
#bInv{width:clamp(104px,29vw,140px);height:clamp(104px,29vw,140px);right:max(18px,env(safe-area-inset-right));bottom:max(36px,env(safe-area-inset-bottom))}
body.swap #bInv{right:auto;left:max(18px,env(safe-area-inset-left))}
body.inv #bInv{border-color:#ffc47a;color:#ffc47a;background:rgba(60,38,10,.55)}
#bInv svg{width:38%;height:38%}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;text-align:center;padding:max(16px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));z-index:5;overflow:auto}
.screen.on{display:flex}
.s3d{background:linear-gradient(180deg,rgba(6,10,18,.62) 0,rgba(6,10,18,0) 28%,rgba(6,10,18,0) 52%,rgba(6,10,18,.82) 100%);justify-content:space-between;pointer-events:none}
.s3d button,.s3d .card{pointer-events:auto}
.solid{background:rgba(8,11,16,.82);backdrop-filter:blur(10px);justify-content:center}
.wallet{align-self:flex-end;font-weight:700;letter-spacing:1px;padding:7px 14px;border-radius:22px;background:rgba(10,14,20,.55);backdrop-filter:blur(8px);font-size:14px;display:flex;gap:8px;align-items:center}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b8,#f0b73a 55%,#9a6a10);box-shadow:0 0 6px #f0b73a88}
h1.logo{font-size:clamp(34px,11vw,66px);margin:6px 0 0;letter-spacing:9px;font-weight:300;line-height:1;text-shadow:0 4px 24px #000a}
h1.logo b{font-weight:800}
.tag{margin:8px 0 0;font-size:12px;letter-spacing:5px;opacity:.85;text-transform:uppercase;text-shadow:0 2px 10px #000a}
.go{padding:16px 54px;font-size:17px;font-weight:800;letter-spacing:5px;color:#0d1116;background:#fff;border:none;border-radius:40px;cursor:pointer;box-shadow:0 8px 30px #0006;touch-action:manipulation}
.go:active{transform:scale(.97)}
.sec{padding:12px 26px;font-size:13px;font-weight:700;letter-spacing:2px;color:#fff;background:rgba(18,24,32,.55);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.5);border-radius:30px;cursor:pointer;text-transform:uppercase;touch-action:manipulation}
.sec:active{background:rgba(255,255,255,.25)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.card{width:min(100%,440px);background:rgba(12,16,22,.72);backdrop-filter:blur(14px);border-radius:22px;padding:18px 20px;border:1px solid rgba(255,255,255,.14)}
.card h2{margin:0 0 4px;font-size:22px;letter-spacing:1px}
.card p{margin:4px 0;font-size:13px;opacity:.85;line-height:1.5}
.sw{display:flex;gap:7px;justify-content:center;margin:10px 0}
.sw i{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);display:block}
.price{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.arrow{position:fixed;top:46%;width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(255,255,255,.6);background:rgba(15,20,26,.5);color:#fff;font-size:20px;display:none;align-items:center;justify-content:center;pointer-events:auto;z-index:6;cursor:pointer}
#shop.on ~ .arrow{display:flex}
#aL{left:max(12px,env(safe-area-inset-left))}#aR{right:max(12px,env(safe-area-inset-right))}
.set{width:min(100%,460px);text-align:left}
.set h2{text-align:center;font-weight:300;letter-spacing:6px;margin:0 0 14px;font-size:24px}
.line{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px}
.line:last-of-type{border:none}
.line input[type=range]{width:46%;accent-color:#ffc47a}
.seg{display:flex;border:1.5px solid rgba(255,255,255,.4);border-radius:20px;overflow:hidden}
.seg button{background:none;border:none;color:#fff;padding:7px 12px;font-size:12px;cursor:pointer;opacity:.7}
.seg button.on{background:#fff;color:#0d1116;opacity:1;font-weight:700}
.tog{width:48px;height:28px;border-radius:16px;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);position:relative;cursor:pointer}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tog.on{background:#ffc47a;border-color:#ffc47a}.tog.on::after{left:23px;background:#1b1308}
.stat{font-size:clamp(32px,9vw,54px);font-weight:700;margin:6px 0}
.small{font-size:12px;opacity:.7}
@media (min-aspect-ratio:3/4){
  #c,#flash,#hud,.screen{left:50%!important;right:auto!important;width:min(100vw,calc(100vh*.5625))!important;transform:translateX(-50%)}
  #c.glitch{animation:none}
  #hint,#toast{left:50%;right:auto;width:min(100vw,calc(100vh*.5625));transform:translateX(-50%)}
  #bInv{right:calc(50% - min(100vw,calc(100vh*.5625))/2 + 18px)}
  body.swap #bInv{left:calc(50% - min(100vw,calc(100vh*.5625))/2 + 18px);right:auto}
  #bPause{right:calc(50% - min(100vw,calc(100vh*.5625))/2 + 14px)}
  #aL{left:calc(50% - min(100vw,calc(100vh*.5625))/2 + 12px)}#aR{right:calc(50% - min(100vw,calc(100vh*.5625))/2 + 12px)}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div>

<div id="hud">
  <div id="top">
    <div style="min-width:74px"><div class="num" id="score">0</div><div class="sm" id="floorlbl">Patro 1</div><div class="sm"><span class="coin" style="width:10px;height:10px"></span> <span id="coinlbl">0</span></div></div>
    <div style="flex:1;min-width:0"><div id="zone">Skybridge</div>
      <div id="ebar"><div id="efill"></div></div><div id="elabel">Chrono-energie</div></div>
    <div style="min-width:74px"><div id="lives">♥♥♥</div></div>
  </div>
</div>
<button id="bPause" aria-label="Pauza">❚❚</button>
<div id="chip"></div>
<div id="hint"></div>
<div id="toast"></div>
<div class="btn" id="bInv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 8v5l-3 2"/><path d="M4 4l3 3M4 4v4h4"/></svg>Inverze</div>

<!-- ÚVODNÍ OBRAZOVKA -->
<div class="screen s3d on" id="menu">
  <div style="width:100%"><div class="wallet"><i class="coin"></i><span id="mWallet">0</span></div>
    <h1 class="logo"><b>CHRONO</b>·SPIRE</h1><p class="tag">Běž věží. Otoč čas.</p></div>
  <div class="col">
    <button class="go" id="bPlay">HRÁT</button>
    <div class="row"><button class="sec" id="bShop">Obchod</button><button class="sec" id="bSet">Nastavení</button></div>
    <p class="small" id="mBest" style="margin:2px 0 0;text-shadow:0 1px 6px #000"></p>
  </div>
</div>

<!-- OBCHOD -->
<div class="screen s3d" id="shop">
  <div style="width:100%;display:flex;justify-content:space-between;align-items:center">
    <button class="sec" id="bShopBack">← Zpět</button><div class="wallet" style="align-self:auto"><i class="coin"></i><span id="sWallet">0</span></div></div>
  <div class="col">
    <div class="card"><h2 id="skName">Kurýr</h2><p id="skDesc"></p><div class="sw" id="skSw"></div>
      <div class="row" style="align-items:center;margin-top:6px"><span class="price" id="skPrice"></span><button class="go" id="bBuy" style="padding:12px 32px;font-size:14px">VYBRAT</button></div>
      <p class="small" id="skIdx" style="margin-top:10px"></p></div>
  </div>
</div>
<button class="arrow" id="aL">◀</button><button class="arrow" id="aR">▶</button>

<!-- NASTAVENÍ -->
<div class="screen solid" id="settings">
  <div class="card set"><h2>NASTAVENÍ</h2>
    <div class="line"><span>Zvukové efekty</span><input type="range" id="sSfx" min="0" max="1" step=".05"></div>
    <div class="line"><span>Hudba</span><input type="range" id="sMus" min="0" max="1" step=".05"></div>
    <div class="line"><span>Grafika</span><div class="seg" id="qSeg"><button data-q="auto">Auto</button><button data-q="low">Nízká</button><button data-q="med">Střední</button><button data-q="high">Vysoká</button></div></div>
    <div class="line"><span>Vibrace</span><div class="tog" id="tHap"></div></div>
    <div class="line"><span>Tlačítko Inverze vlevo</span><div class="tog" id="tSwap"></div></div>
    <div class="line"><span>Citlivost švihů</span><input type="range" id="sSwipe" min="18" max="60" step="2"></div>
    <div class="line"><span>Smazat postup a skiny</span><button class="sec" id="bReset" style="padding:8px 16px">Smazat</button></div>
    <div class="row" style="margin-top:14px"><button class="go" id="bSetBack" style="padding:12px 40px;font-size:14px">HOTOVO</button></div>
  </div>
</div>

<!-- PAUZA -->
<div class="screen solid" id="pause">
  <h1 class="logo" style="font-size:clamp(28px,8vw,48px)">PAUZA</h1>
  <div class="col" style="margin-top:22px"><button class="go" id="bResume">POKRAČOVAT</button><button class="sec" id="bQuit">Ukončit běh</button></div>
</div>

<!-- KONEC -->
<div class="screen solid" id="over">
  <h1 class="logo" style="font-size:clamp(26px,7vw,44px);letter-spacing:6px">KONEC BĚHU</h1>
  <div class="stat" id="oScore">0</div>
  <p id="oInfo" style="line-height:1.7;opacity:.9"></p>
  <div class="col" style="margin-top:16px"><button class="go" id="bRetry">ZNOVU</button><button class="sec" id="bHome">Hlavní menu</button></div>
</div>

<script src="three.min.js"></script>
<script src="three-post.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;

// ================= SAVE / SETTINGS =================
const SAVE_KEY='chrono_save_v2';
const DEF_SET={sfx:.8,music:.55,quality:'auto',haptics:true,swap:false,swipe:32};
let save={wallet:0,owned:['std'],skin:'std',best:0,set:Object.assign({},DEF_SET)};
try{const s=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(s){save=Object.assign(save,s);save.set=Object.assign({},DEF_SET,s.set||{})}}catch(e){}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save))}catch(e){}}

// ================= RENDERER =================
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x9dbbd6,60,330);
const camera=new THREE.PerspectiveCamera(66,1,0.1,900);
let baseFov=66;
const hemi=new THREE.HemisphereLight(0xbcd4ee,0x6a6258,.6);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff1e0,1.6);sun.castShadow=true;
const shc=sun.shadow.camera;shc.left=-22;shc.right=22;shc.top=22;shc.bottom=-22;shc.near=1;shc.far=140;
sun.shadow.bias=-.0004;sun.shadow.normalBias=.05;
scene.add(sun);scene.add(sun.target);
const fill=new THREE.DirectionalLight(0xdde8ff,.35);scene.add(fill);scene.add(fill.target);
const plight=new THREE.PointLight(0xffc47a,0,24);scene.add(plight);

// quality
const QUAL={low:{pr:1,shadow:0,bloom:false,msaa:0,towers:16},med:{pr:1.25,shadow:1024,bloom:true,msaa:2,towers:30},high:{pr:2,shadow:2048,bloom:true,msaa:4,towers:46}};
let qCur='high',composer=null,bloomPass=null,gradePass=null;
function effQuality(){const q=save.set.quality;return q==='auto'?(isTouch?'med':'high'):q}
function applyQuality(name){
  qCur=name||effQuality();const Q=QUAL[qCur];
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,Q.pr));
  sun.castShadow=Q.shadow>0;
  if(Q.shadow>0&&sun.shadow.mapSize.x!==Q.shadow){sun.shadow.mapSize.set(Q.shadow,Q.shadow);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  setupComposer();resize();
  if(typeof towers!=='undefined')towers.forEach((t,i)=>t.visible=i<Q.towers&&outdoorNow);
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;baseFov=w/h<1?76:60;camera.updateProjectionMatrix();
  if(composer){const pr=renderer.getPixelRatio();composer.setSize(Math.floor(w*pr),Math.floor(h*pr));if(gradePass)gradePass.uniforms.res.value.set(w*pr,h*pr)}
}
addEventListener('resize',resize);

// ================= TEXTURES =================
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function srgb(t){t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());return t}
function grain(ctx,w,h,amp){const id=ctx.getImageData(0,0,w,h),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*amp;d[i]+=n;d[i+1]+=n;d[i+2]+=n}ctx.putImageData(id,0,0)}
function blots(ctx,w,h,n,rmin,rmax,amax){for(let i=0;i<n;i++){const x=Math.random()*w,y=Math.random()*h,r=rnd(rmin,rmax),dark=Math.random()<.5;const g=ctx.createRadialGradient(x,y,0,x,y,r);const a=rnd(.02,amax);g.addColorStop(0,dark?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}}
function normalFromCanvas(src,strength){
  const w=src.width,h=src.height,sx=src.getContext('2d').getImageData(0,0,w,h).data;
  const c=mkCanvas(w,h),x=c.getContext('2d'),o=x.createImageData(w,h),d=o.data;
  const L=(i,j)=>{const k=(((j+h)%h)*w+((i+w)%w))*4;return (sx[k]+sx[k+1]+sx[k+2])/765};
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const dx=(L(i+1,j)-L(i-1,j))*strength,dy=(L(i,j+1)-L(i,j-1))*strength,n=Math.hypot(dx,dy,1),k=(j*w+i)*4;d[k]=(-dx/n*.5+.5)*255;d[k+1]=(dy/n*.5+.5)*255;d[k+2]=(1/n*.5+.5)*255;d[k+3]=255}
  x.putImageData(o,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;
}
function asphaltCanvas(){
  const S=512,c=mkCanvas(S,S),x=c.getContext('2d');x.fillStyle='#4a4d52';x.fillRect(0,0,S,S);
  blots(x,S,S,70,40,150,.06);grain(x,S,S,16);
  for(let i=0;i<260;i++){x.fillStyle=`rgba(${Math.random()<.5?'255,255,255':'0,0,0'},${rnd(.03,.1)})`;x.fillRect(rnd(0,S),rnd(0,S),rnd(1,3),rnd(1,3))}
  x.strokeStyle='rgba(0,0,0,.45)';x.lineWidth=3;x.strokeRect(0,0,S,S);return c;
}
const deckC=asphaltCanvas();
const deckTex=srgb(new THREE.CanvasTexture(deckC));deckTex.repeat.set(2,4);
const deckNrm=normalFromCanvas(deckC,1.6);deckNrm.repeat.set(2,4);
function concreteCanvas(base,joints){
  const S=512,c=mkCanvas(S,S),x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,S,S);
  blots(x,S,S,70,40,160,.07);grain(x,S,S,10);
  if(joints){x.strokeStyle='rgba(0,0,0,.4)';x.lineWidth=3;x.strokeRect(1,1,S-2,S-2)}return c;
}
const concC=concreteCanvas('#aeb0b2',false);
const concTex=srgb(new THREE.CanvasTexture(concC));
const concNrm=normalFromCanvas(concC,1.8);
const floorIC=concreteCanvas('#70747a',true);
const floorITex=srgb(new THREE.CanvasTexture(floorIC));floorITex.repeat.set(4,8);
function serverCanvas(){
  const S=512,c=mkCanvas(S,S),x=c.getContext('2d');x.fillStyle='#2a2e34';x.fillRect(0,0,S,S);
  for(let r=0;r<4;r++)for(let k=0;k<2;k++){const px=k*256,py=r*128;x.fillStyle='#1d2025';x.fillRect(px+6,py+6,244,116);x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;x.strokeRect(px+6,py+6,244,116);
    for(let i=0;i<9;i++){x.fillStyle='#0d0f12';x.fillRect(px+18,py+14+i*11,150,5)}

function mkDeadEnd(z){

  for(let k=0;k<5;k++){const cb=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,rnd(6,12),6),mCable);cb.position.set(rnd(-4.5,4.5),rnd(-3,-1),-rnd(.5,2));cb.rotation.set(rnd(-.4,.4),0,rnd(-.2,.2));g.add(cb)}

function mkShaft(z,side){

function clearWorld(){for(const o of obs)scene.remove(o.g);obs.length=0;for(const c of coins)scene.remove(c.m);coins.length=0;for(const e of echoes)scene.remove(e.g);echoes.length=0;for(const g of extras)scene.remove(g);extras.length=0}
function genFloor(){
  clearWorld();E=Math.ceil((420+floor*60)/TILE)*TILE;
  shaftSide=Math.random()<.5?-1:1;shaftZ=-(E-rnd(80,140));
  mkDeadEnd(-E);mkShaft(shaftZ,shaftSide);
  let z=-60,last='';
  while(z>-(E-30)){
    const safe=z<shaftZ+30;
    let pool=['low','low','high','high','block','pit','glass','train','crate','coins','coins'];
    if(safe)pool=['low','high','block','pit','coins','coins'];
    let t;do{t=pool[(Math.random()*pool.length)|0]}while(t===last&&Math.random()<.7);last=t;
    const li=(Math.random()*3)|0;
    if(Math.abs(z-shaftZ)<14){z-=16;continue}
    switch(t){
      case'low':{const set=new Set([li]);if(Math.random()<.4)set.add((li+1+((Math.random()*2)|0))%3);for(const i of set)obs.push(mkLow(i,z));const f=[0,1,2].filter(i=>!set.has(i))[0];coinLine(laneX(f),z+8,z-8,7);break}
      case'high':{const set=new Set([li]);if(Math.random()<.4)set.add((li+1)%3);for(const i of set)obs.push(mkHigh(i,z));const f=[0,1,2].filter(i=>!set.has(i))[0];coinLine(laneX(f),z+8,z-8,7);break}
      case'block':{const set=new Set([li]);if(Math.random()<.45)set.add((li+1)%3);for(const i of set)obs.push(mkBlock(i,z));const f=[0,1,2].filter(i=>!set.has(i))[0];coinLine(laneX(f),z+10,z-10,9);break}
      case'pit':{obs.push(mkPit(z));coinLine(0,z+3.5,z-3.5,5,1.2,2.2);break}
      case'glass':{const i=(Math.random()*2)|0;obs.push(mkGlass(i,z));coinLine(laneX(i===0?2:0),z+8,z-8,7);break}
      case'train':{obs.push(mkTrain(li,z-40));coinLine(laneX((li+1)%3),z+6,z-10,8);break}
      case'crate':{obs.push(mkCrate(li,z));coinLine(laneX((li+1+((Math.random()*2)|0))%3),z+6,z-6,6);break}
      case'coins':{coinLine(laneX((Math.random()*3)|0),z+10,z-10,10);break}
    }
    z-=rnd(26,40)-Math.min(8,floor*1.5);
  }
  coinLine(laneX(shaftSide>0?2:0),shaftZ+14,shaftZ-14,9);
}

// ================= AUDIO =================
let ac=null,master,musG,sfxG,lp,noiseBuf,bus,step=0,nextNote=0;
const BASS=[38,0,38,0,41,0,43,0,38,0,38,0,46,45,43,0],ARP=[74,0,77,0,81,0,77,0,74,0,79,0,82,0,79,0];
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return}
  try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.55;
    lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=14000;master.connect(lp);lp.connect(ac.destination);
    musG=ac.createGain();sfxG=ac.createGain();musG.connect(master);sfxG.connect(master);applyVolumes();
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    nextNote=ac.currentTime+.1;setInterval(scheduler,30)}catch(e){ac=null}
}
function applyVolumes(){if(!ac)return;musG.gain.value=save.set.music;sfxG.gain.value=save.set.sfx}
function tone(type,f,t,dur,vol,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.02)}
function noise(t,dur,vol,ft,f,f2,swell){const s=ac.createBufferSource();s.buffer=noiseBuf;const fl=ac.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=ac.createGain();
  if(swell){g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(vol,t+dur*.95);g.gain.setValueAtTime(0,t+dur)}else{g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur)}
  s.connect(fl);fl.connect(g);g.connect(bus);s.start(t);s.stop(t+dur+.05)}
function scheduler(){
  if(!ac)return;bus=musG;const bpm=inv?74:124,sd=60/bpm/4;
  while(nextNote<ac.currentTime+.14){
    const s=step,sh=inv?-7:0;
    if(state==='play'||state==='pause'){
      if(state==='play'){
        if(s%4===0)tone('sine',inv?100:140,nextNote,.18,.8,40);
        if(!inv&&s%2===1)noise(nextNote,.05,.1,'highpass',7000);
        if(inv&&s%4===2)noise(nextNote,sd*3.6,.14,'bandpass',500,5000,true);
        const b=BASS[s];if(b)tone('sawtooth',mf(b+sh),nextNote,sd*1.6,.17);
        const a=ARP[s];if(a)tone(inv?'triangle':'square',mf(a+sh),nextNote,sd*1.1,inv?.1:.05);
      }
    }else{if(s%8===0)tone('sine',mf(50),nextNote,sd*7,.15);const a=ARP[s];if(a&&s%4===0)tone('triangle',mf(a-12),nextNote,sd*3,.06)}
    step=inv?(s+15)%16:(s+1)%16;nextNote+=sd;
  }
}
function sfx(k){
  if(!ac)return;bus=sfxG;const t=ac.currentTime+.01;
  if(k==='on'){noise(t,.6,.4,'bandpass',4000,200);tone('sawtooth',900,t,.6,.22,50)}
  else if(k==='off'){noise(t,.45,.35,'bandpass',200,5000);tone('sawtooth',70,t,.45,.22,1100)}
  else if(k==='coin'){tone('sine',1320,t,.07,.12);tone('sine',1980,t+.05,.12,.1)}
  else if(k==='hit'){noise(t,.4,.55,'lowpass',2000,100);tone('sine',110,t,.4,.6,30)}
  else if(k==='jump'){tone('triangle',280,t,.18,.18,640)}
  else if(k==='slide'){noise(t,.3,.2,'bandpass',1800,300)}
  else if(k==='phase'){tone('triangle',660,t,.1,.18);tone('triangle',990,t+.08,.2,.18)}
  else if(k==='fall'){tone('sine',600,t,.7,.28,40)}
  else if(k==='echo'){noise(t,.25,.35,'bandpass',900,200);tone('sawtooth',90,t,.3,.25,45)}
  else if(k==='ui'){tone('triangle',520,t,.08,.15,780)}
  else if(k==='buy'){tone('triangle',660,t,.1,.2);tone('triangle',880,t+.08,.1,.2);tone('triangle',1320,t+.16,.25,.2)}
}
function setAudioInv(){if(ac)lp.frequency.setTargetAtTime(inv?1400:14000,ac.currentTime,.08)}

// ================= UPDATE =================
function update(dt){
  glitchT=Math.max(0,glitchT-dt*2.2);invCool=Math.max(0,invCool-dt);invuln=Math.max(0,invuln-dt);stun=Math.max(0,stun-dt);shake=Math.max(0,shake-dt*1.4);slideT=Math.max(0,slideT-dt);
  worldT+=(inv?-1:1)*dt;const zd=zdirOf();
  const base=17+Math.min(13,floor*1.2+progress/160);
  speedMod=lerp(speedMod,stun>0?.55:1,Math.min(1,dt*8));
  speed=base*speedMod*(inv?.72:1);

  if(fall>0){
    fall-=dt;P.vy-=40*dt;P.y+=P.vy*dt;
    if(fall<=0){const pit=obs.find(o=>o.type==='pit'&&o.fell);if(pit){P.z=pit.z+14;pit.fell=false}
      P.y=0;P.vy=0;P.lane=1;invuln=2;if(inv)setInv(false,true);integrity--;updateLives();toast('Pád do šachty','#ffb0a0');shake=.6;if(integrity<=0){endGame();return}}
  }else{
    stuck=false;let mv=speed;
    if(!inv&&P.z-mv*dt<-E+4){mv=Math.max(0,(P.z-(-E+4))/dt);stuck=true}
    if(inv&&P.z+mv*dt>60){mv=Math.max(0,(60-P.z)/dt)}
    P.z+=zd*mv*dt;
    if(-P.z>progress){score+=(-P.z-progress);progress=-P.z}
    P.x=lerp(P.x,laneX(P.lane),Math.min(1,dt*14));
    if(P.y>0||P.vy>0){P.vy-=30*dt;P.y+=P.vy*dt;if(P.y<=0){P.y=0;P.vy=0}}
    airT=P.y>.05?Math.min(1,airT+dt*10):Math.max(0,airT-dt*10);
  }
  P.runT+=dt*speed*.5*(inv?-1:1);

  if(inv){energy-=9*dt;if(energy<=0){energy=0;setInv(false);toast('Energie vyčerpána','#ffb0a0')}}
  else energy=Math.min(100,energy+(stuck?14:1.6)*dt);

  if(P.z<shaftZ-6)passedShaft=true;
  if(inv&&fall<=0&&Math.abs(P.z-shaftZ)<3&&Math.abs(P.x-shaftSide*3.2)<1.8){nextFloor();return}

  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];
    switch(o.type){
      case'train':{if(!o.act&&Math.abs(o.z0-P.z)<110&&!inv){o.act=true;o.w0=worldT}
        if(o.act){const tau=Math.max(0,worldT-o.w0);o.z=o.z0+14*tau;o.g.position.z=o.z;if(tau===0&&inv)o.act=false}break}
      case'crate':{const near=Math.abs(o.z-P.z)<40;if(near)o.d=clamp(o.d+(inv?-1:1)*dt/.7,0,1);else if(inv)o.d=clamp(o.d-dt/.7,0,1);o.g.position.y=(1-o.d)*(1-o.d)*8;break}
      case'pit':{o.bt=lerp(o.bt,inv?1:0,Math.min(1,dt*(inv?5:9)));const N=o.steps.length;
        o.steps.forEach((m,k)=>{m.scale.y=Math.max(.001,clamp(o.bt*(N+2)-k,0,1))});
        for(const r of o.rub){r.m.visible=o.bt<.9;r.m.position.y=r.by+o.bt*3;r.m.scale.setScalar(1-o.bt*.9)}
        if(fall<=0&&Math.abs(P.z-o.z)<o.hl&&P.y<=.05&&!inv&&!o.fell){o.fell=true;fall=.8;P.vy=-2;sfx('fall');haptic(120);shake=.6}break}
    }
    if(fall>0||inv)continue;
    const hit=Math.abs(P.z-o.z)<(o.hl||0)+.5&&Math.abs(P.x-o.cx)<(o.hw||0)+.45;
    if(!hit||invuln>0)continue;
    if(o.type==='low'&&P.y<.85)damage('Zábrana');
    else if(o.type==='high'&&slideT<=0)damage('Hlavou do trámu');
    else if(o.type==='block'&&P.y<3.2)damage('Kontejner');
    else if(o.type==='train'&&o.act)damage('Vlak');
    else if(o.type==='crate'&&o.d>.55&&P.y<2)damage('Padající bedna');
    else if(o.type==='glass')damage('Skleněná stěna');
  }
  // ghost materials
  const go=inv?.3:1;for(const m of ghostMats){m.opacity=lerp(m.opacity,go,Math.min(1,dt*6));m.depthWrite=m.opacity>.95}

  for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.m.rotation.y+=dt*4;
    if(!c.dead&&fall<=0&&Math.abs(c.z-P.z)<1.3&&Math.abs(c.x-P.x)<1.2&&Math.abs((P.y+.9)-c.y)<1.5){c.dead=true;coinsGot++;energy=Math.min(100,energy+1.5);sfx('coin');haptic(5)}
    if(c.dead){scene.remove(c.m);coins.splice(i,1)}}

  if(inv){echoT-=dt;if(echoT<=0){spawnEcho();echoT=rnd(1.1,1.9)}}
  for(let i=echoes.length-1;i>=0;i--){const e=echoes[i];if(!inv)e.dying=true;
    if(e.dying){const s=e.g.scale.x-dt*3;if(s<=.03){scene.remove(e.g);echoes.splice(i,1);continue}e.g.scale.setScalar(s)}
    else{e.g.scale.setScalar(Math.min(.95,e.g.scale.x+dt*2));e.g.position.z+=(speed+13)*dt;e.rt+=dt*11;animHuman(e.h,e.rt,0,0,0,0,false,0);
      if(fall<=0&&Math.abs(e.g.position.z-P.z)<1&&Math.abs(e.g.position.x-P.x)<1.1&&P.y<1.4&&invuln<=0){energy=Math.max(0,energy-18);stun=.7;invuln=.8;shake=.4;sfx('echo');haptic(60);toast('Echo stín · −energie','#ffc47a');e.dying=true}
      if(e.g.position.z>P.z+14){scene.remove(e.g);echoes.splice(i,1)}}}

  hintT-=dt;
  if(hintT<=0){hintT=.15;const h=$('hint'),chip=$('chip');let txt='',col='#fff';
    if(stuck||(!inv&&P.z<-E+90)){txt='Slepá ulička! Stiskni INVERZI a běž pozpátku k šachtě';col='#ffc47a'}
    else if(inv){const d=Math.round(Math.abs(P.z-shaftZ)),ahead=(shaftZ-P.z)*zd>0;if(ahead&&d>4){txt='Šachta za '+d+' m · pruh '+(shaftSide>0?'vpravo':'vlevo');col='#9fe9b3'}}
    h.textContent=txt;h.style.color=col;h.style.opacity=txt?1:0;
    if(passedShaft||P.z<shaftZ+110){const d=Math.round(Math.abs(P.z-shaftZ)),behind=P.z<shaftZ;chip.classList.add('show');chip.textContent='Šachta · '+d+' m '+(behind?'za tebou':'před tebou')+' · '+(shaftSide>0?'vpravo':'vlevo')}else chip.classList.remove('show')}

  $('score').textContent=totalScore();$('floorlbl').textContent='Patro '+(floor+1)+' · '+Math.floor(progress)+' m';$('coinlbl').textContent=coinsGot;
  $('efill').style.width=energy+'%';$('elabel').textContent=inv?'Inverze aktivní':'Chrono-energie';
}

// ================= DUST / WIND =================
const NP=170,pArr=new Float32Array(NP*3);
for(let i=0;i<NP;i++){pArr[i*3]=rnd(-12,12);pArr[i*3+1]=rnd(.3,12);pArr[i*3+2]=rnd(-90,90)}
const pGeo=new THREE.BufferGeometry();pGeo.setAttribute('position',new THREE.BufferAttribute(pArr,3));
const pMat=new THREE.PointsMaterial({map:soft,color:0xffffff,size:.3,transparent:true,opacity:.3,depthWrite:false});
const dust=new THREE.Points(pGeo,pMat);dust.frustumCulled=false;scene.add(dust);

// ================= VISUALS =================
const camPos=new THREE.Vector3();let menuA=0;
function updateVisuals(dt,t){
  const playing=state==='play'||state==='pause'||state==='over';
  // player
  pg.position.set(P.x,Math.max(P.y,fall>0?P.y:0),P.z);
  pBlob.position.set(P.x,.035,P.z);pBlob.scale.setScalar(P.y>0?Math.max(.4,1-P.y*.25):1);
  if(state==='shop'){pg.rotation.y+=dt*.7}else pg.rotation.y=lerp(pg.rotation.y,0,Math.min(1,dt*6));
  const lean=clamp((laneX(P.lane)-P.x)*.07,-.3,.3);
  pose.slide=lerp(pose.slide,slideT>0?1:0,Math.min(1,dt*16));pose.air=lerp(pose.air,airT,Math.min(1,dt*14));
  pose.idle=lerp(pose.idle,playing?0:1,Math.min(1,dt*8));
  animHuman(player,P.runT,pose.air,pose.slide,lean,pose.idle,inv,t);
  pg.visible=invuln<=0||Math.floor(t*14)%2===0||!playing;
  if(player.watch)player.watch.material.color.setHex(inv?0xffb55a:0x7c8691);
  plight.position.set(P.x,3,P.z+3);plight.intensity=inv?.7:0;

  // lights follow player
  const L=skyU.sunDir.value;
  sun.position.set(P.x+L.x*70,L.y*70+8,P.z+L.z*70);sun.target.position.set(P.x,0,P.z);sun.target.updateMatrixWorld();
  fill.position.set(P.x-8,14,P.z+22);fill.target.position.set(P.x,0,P.z-4);fill.target.updateMatrixWorld();
  skyMesh.position.copy(camera.position);

  // camera
  camX=lerp(camX,P.x,Math.min(1,dt*7));
  if(playing){
    const tR=inv?13.8:9.4,tH=inv?8.6:5.2,tLook=inv?3:14,tF=inv?11:0;
    camR=lerp(camR,tR,Math.min(1,dt*2.4));camH=lerp(camH,tH,Math.min(1,dt*2.4));camLook=lerp(camLook,tLook,Math.min(1,dt*2.4));camFov=lerp(camFov,tF,Math.min(1,dt*2.4));
    camPos.set(camX*.6,camH+Math.max(0,P.y)*.35,P.z+camR);camera.position.copy(camPos);
    if(shake>0){camera.position.x+=(Math.random()-.5)*shake*.5;camera.position.y+=(Math.random()-.5)*shake*.5}
    camera.lookAt(camX*.7,1.7,P.z-camLook);
    const fov=baseFov+camFov+clamp((speed-17)*.3,0,6);camera.fov=lerp(camera.fov,fov,Math.min(1,dt*4));
  }else{
    menuA+=dt*.25;
    const shopV=state==='shop';
    const rad=shopV?2.9:3.9,ax=shopV?.45:Math.sin(menuA)*.55;
    camera.position.set(Math.sin(ax)*rad+.2,shopV?1.45:1.55,P.z-Math.cos(ax)*rad);
    camera.lookAt(0,shopV?1.0:1.15,P.z);
    camera.fov=lerp(camera.fov,shopV?42:46,Math.min(1,dt*4));
  }
  camera.updateProjectionMatrix();

  // dust drifts
  const dv=inv?24:0;
  for(let i=0;i<NP;i++){let z=pArr[i*3+2]+dv*dt;if(z>P.z+90)z-=180;else if(z<P.z-90)z+=180;pArr[i*3+2]=z}
  pGeo.attributes.position.needsUpdate=true;pMat.opacity=inv?.5:.3;
  updateTiles(P.z);updatePylons(P.z);updateTowers(P.z);updateClouds(P.z,t);
  applyLook(dt);
}

// ================= INPUT =================
addEventListener('keydown',e=>{
  if(e.repeat)return;const k=e.key.toLowerCase();
  if(state==='menu'){if(k==='enter'||k===' ')startGame();return}
  if(state==='pause'){if(k==='escape'||k==='p')resumeGame();return}
  if(state==='over'){if(k==='enter'||k===' ')startGame();return}
  if(state!=='play')return;
  if(k==='escape'||k==='p'){pauseGame();return}
  if(k==='arrowleft'||k==='a')lane(-1);
  else if(k==='arrowright'||k==='d')lane(1);
  else if(k===' '||k==='arrowup'||k==='w'){jump();e.preventDefault()}
  else if(k==='arrowdown'||k==='s'){slide();e.preventDefault()}
  else if(k==='shift'||k==='e'||k==='q'){toggleInv();e.preventDefault()}
});
let sid=null,sx=0,sy2=0;
canvas.addEventListener('pointerdown',e=>{if(state!=='play'||sid!==null)return;sid=e.pointerId;sx=e.clientX;sy2=e.clientY;try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',e=>{if(e.pointerId!==sid)return;const dx=e.clientX-sx,dy=e.clientY-sy2,T=save.set.swipe;
  if(Math.abs(dx)>T&&Math.abs(dx)>Math.abs(dy)){lane(dx>0?1:-1);sx=e.clientX;sy2=e.clientY}
  else if(dy<-T){jump();sx=e.clientX;sy2=e.clientY}else if(dy>T){slide();sx=e.clientX;sy2=e.clientY}});
const endS=e=>{if(e.pointerId===sid)sid=null};canvas.addEventListener('pointerup',endS);canvas.addEventListener('pointercancel',endS);
(function(){const b=$('bInv');b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();b.classList.add('down');toggleInv()});
  const up=()=>b.classList.remove('down');b.addEventListener('pointerup',up);b.addEventListener('pointerleave',up);b.addEventListener('pointercancel',up)})();
const on=(id,fn)=>$(id).addEventListener('click',e=>{e.stopPropagation();fn(e)});
on('bPlay',()=>{sfx('ui');startGame()});
on('bShop',()=>{initAudio();sfx('ui');state='shop';shopIdx=Math.max(0,SKINS.findIndex(s=>s.id===save.skin));showScreen('shop');renderShop()});
on('bShopBack',()=>{sfx('ui');toMenu()});
on('aL',()=>{sfx('ui');shopIdx=(shopIdx+SKINS.length-1)%SKINS.length;renderShop()});
on('aR',()=>{sfx('ui');shopIdx=(shopIdx+1)%SKINS.length;renderShop()});
on('bBuy',()=>{const s=SKINS[shopIdx];
  if(save.skin===s.id)return;
  if(save.owned.includes(s.id)){save.skin=s.id;persist();sfx('ui')}
  else if(save.wallet>=s.price){save.wallet-=s.price;save.owned.push(s.id);save.skin=s.id;persist();sfx('buy');haptic(30)}
  else{haptic(40);const b=$('bBuy');b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],{duration:220})}
  renderShop();refreshMenu()});
on('bSet',()=>{initAudio();sfx('ui');state='settings';buildSettingsUI();showScreen('settings')});
on('bSetBack',()=>{sfx('ui');persist();toMenu()});
$('sSfx').addEventListener('input',e=>{save.set.sfx=+e.target.value;applyVolumes()});
$('sMus').addEventListener('input',e=>{save.set.music=+e.target.value;applyVolumes()});
$('sSwipe').addEventListener('input',e=>{save.set.swipe=+e.target.value});
document.querySelectorAll('#qSeg button').forEach(b=>b.addEventListener('click',()=>{save.set.quality=b.dataset.q;buildSettingsUI();applyQuality()}));
on('tHap',()=>{save.set.haptics=!save.set.haptics;buildSettingsUI();if(save.set.haptics)haptic(30)});
on('tSwap',()=>{save.set.swap=!save.set.swap;buildSettingsUI();document.body.classList.toggle('swap',save.set.swap)});
let resetArm=0;
on('bReset',()=>{const b=$('bReset');if(!resetArm){resetArm=1;b.textContent='Opravdu?';setTimeout(()=>{resetArm=0;b.textContent='Smazat'},2500)}else{save={wallet:0,owned:['std'],skin:'std',best:0,set:Object.assign({},DEF_SET)};persist();resetArm=0;b.textContent='Smazáno';buildSettingsUI();applyVolumes()}});
on('bPause',()=>pauseGame());
on('bResume',()=>{sfx('ui');resumeGame()});
on('bQuit',()=>{bank();toMenu()});
on('bRetry',()=>{sfx('ui');startGame()});
on('bHome',()=>{sfx('ui');toMenu()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pauseGame()});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());

// ================= MAIN LOOP =================
let last=performance.now(),fpsAcc=0,fpsN=0;
setSkin(save.skin);
applyQuality();
setZone(0,true);
genFloor();refreshMenu();
camera.position.set(0,1.5,-3.9);
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);last=now;const t=now/1000;
  if(state==='play')update(dt);
  else if(state==='pause'){}
  else{P.runT+=dt*.2;pg.position.x=0}
  updateVisuals(dt,t);
  if(composer)composer.render(dt);else renderer.render(scene,camera);
  if(state==='play'&&save.set.quality==='auto'){fpsAcc+=dt;fpsN++;
    if(fpsAcc>3){const f=fpsN/fpsAcc;fpsAcc=0;fpsN=0;if(f<30){const nq=qCur==='high'?'med':qCur==='med'?'low':null;if(nq)applyQuality(nq)}}}
}
requestAnimationFrame(frame);

window.__chrono={get state(){return state},get inv(){return inv},get energy(){return energy},get integrity(){return integrity},get floor(){return floor},get E(){return E},get shaftZ(){return shaftZ},get shaftSide(){return shaftSide},P,start:startGame,toggle:toggleInv,jump,slide,lane,setZ(z){P.z=z},god(){integrity=99},clearObs(){for(const o of obs)scene.remove(o.g);obs.length=0},setZone,save,scene,renderer};
})();
</script>
